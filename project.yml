name: LogLoop
options:
  bundleIdPrefix: com.massimoschiavo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  LogLoop:
    type: application
    platform: iOS
    sources:
      - LogLoop/Sources
      - LogLoop/Resources
    info:
      path: LogLoop/Info.plist
      properties:
        CFBundleDisplayName: LogLoop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.massimoschiavo.logloop
        DEVELOPMENT_TEAM: "ELD4A89N37"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  LogLoop:
    build:
      targets:
        LogLoop: all
    run:
      config: Debug
    archive:
      config: Release
