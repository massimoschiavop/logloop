name: Release IPA

# Pubblicare una versione: git tag v1.1 && git push origin v1.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Crea l'IPA non firmato
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/build_ipa.sh "$VERSION" "$GITHUB_RUN_NUMBER"

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/LogLoop.ipa \
            --title "LogLoop $VERSION" \
            --notes "IPA non firmato per KravaSign e altri signer."

      - name: Aggiorna la sorgente apps.json su main
        run: |
          git fetch origin main
          git checkout main
          python3 scripts/update_source.py "$VERSION" "$GITHUB_RUN_NUMBER" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/LogLoop.ipa" \
            build/LogLoop.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Aggiorna apps.json a LogLoop $VERSION"
          git push origin main
